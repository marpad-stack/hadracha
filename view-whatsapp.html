<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<style>
  html, body { margin:0; padding:0; background:#2b0a30; height:100%; display:flex; align-items:center; justify-content:center; font-family: Arial, sans-serif; }
  .frame { position:relative; }
  img { max-width: 1180px; max-height: 560px; border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); border: 3px solid #FFD400; }
  #tut-caption-bar {
    position: fixed; left: 0; right: 0; bottom: 0; width: 100%;
    background: linear-gradient(180deg, rgba(75,21,84,0.92), #3a1042 60%);
    color: #fff; padding: 22px 40px 26px; box-sizing: border-box;
    font-size: 28px; font-weight: 800; line-height: 1.35;
    direction: rtl; text-align: center;
    box-shadow: 0 -6px 30px rgba(0,0,0,0.45);
    border-top: 5px solid #FFD400;
  }
</style>
</head>
<body>
  <div class="frame"><img src="whatsapp-spotlight.png"></div>
  <div id="tut-caption-bar">👉 וכך בדיוק נראית הודעת הקוד שמתקבלת בוואטסאפ מ"הארה למעשה"</div>
</body>
</html>
