<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<style>
  html, body { margin:0; padding:0; height:100%; font-family: Arial, sans-serif;
    background: radial-gradient(circle at 50% 30%, #6b1b78 0%, #3a1042 55%, #250830 100%);
    display:flex; align-items:center; justify-content:center; }
  .wrap { text-align:center; color:#fff; padding: 40px; }
  .spark { font-size: 40px; letter-spacing: 18px; color:#FFD400; margin-bottom: 6px; }
  .logo { font-size: 64px; font-weight: 900; color:#fff; margin: 0; text-shadow: 0 4px 20px rgba(0,0,0,0.4); }
  .sub { font-size: 20px; color:#e8cdee; margin-top: 6px; letter-spacing: 1px; }
  .divider { width: 120px; height: 3px; background: #FFD400; margin: 28px auto; border-radius: 3px; }
  .welcome { font-size: 34px; font-weight: 800; margin-bottom: 14px; }
  .desc { font-size: 22px; color:#e8cdee; max-width: 760px; margin: 0 auto; line-height:1.6; }
  .part-badge { display:inline-block; margin-top: 30px; background:#FFD400; color:#3a1042; font-weight:900;
    font-size: 20px; padding: 10px 26px; border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,0.35); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="spark">✧ ✦ ✧</div>
    <div class="logo">הארה למעשה</div>
    <div class="sub">מרכז להדרכות חינוכיות</div>
    <div class="divider"></div>
    <div class="welcome">ממשיכים הלאה! 🧭</div>
    <div class="desc">בחלק הזה נלמד את כל הדרכים למצוא מערכים באתר - מהעמוד הראשי, דרך עולמות התוכן, ועד לחיפוש המתקדם</div>
    <div class="part-badge">חלק 2 · איך למצוא מערכים באתר</div>
  </div>
</body>
</html>
